-- Knot Resolver configuration for NextPATH with dual-instance support
local min_ttl, max_ttl, neg_ttl = 300, 86400, 10800
local instance = os.getenv('SYSTEMD_INSTANCE') or '1'
local base_instance = instance:match('^([^_%s]+)') or '1'



-- Dynamic import of DNS upstreams
local dns_var = os.getenv('UPSTREAM_DNS') or '1'
local sets = {
    ['1'] = {'1.1.1.1', '1.0.0.1', '9.9.9.10', '149.112.112.10'}, -- Cloudflare + Quad9
    ['2'] = {'8.8.8.8', '8.8.4.4', '1.1.1.1'}, -- Google + Cloudflare
    ['3'] = {'208.67.222.222', '208.67.220.220'}, -- OpenDNS
    ['4'] = {'9.9.9.10', '149.112.112.10'}, -- Quad9 (No ECS)
    ['5'] = {'76.76.2.0', '9.9.9.10'}, -- ControlD + Quad9
    ['6'] = {'94.140.14.140', '94.140.14.141'}, -- AdGuard DNS Global
    ['7'] = {'185.228.168.168', '185.228.169.168'} -- CleanBrowsing (Family)
}

local upstreams = sets[dns_var]
if not upstreams then
    upstreams = {}
    for ip in string.gmatch(dns_var, '([^,%s"\']+)') do
        if string.match(ip, "^%d+%.%d+%.%d+%.%d+$") or string.match(ip, ":") then
            table.insert(upstreams, ip)
        end
    end
    if #upstreams == 0 then upstreams = sets['1'] end
end

-- Normalize boolean env vars: accept true/1/y/yes → 'y', anything else → 'n'
local function bool_env(key, default_y)
    local v = os.getenv(key)
    if not v or v == '' then return default_y and 'y' or 'n' end
    v = v:lower()
    if v == 'true' or v == '1' or v == 'y' or v == 'yes' then return 'y' end
    return 'n'
end

-- Alternative domain zones (.bbs, .pirate, .lib, etc.)
local alt_zones = policy.todnames({'bbs', 'chan', 'cyb', 'dyn', 'epic', 'geek', 'gopher', 'indy', 'libre', 'neo', 'null', 'o', 'oss', 'oz', 'parody', 'pirate', 'opennic.glue', 'bazar', 'coin', 'emc', 'lib', 'fur', 'ku', 'te', 'ti', 'uu', 'ko', 'rm', 'bit', 'glue'})

local pub            = bool_env('PUBLIC_DNS',    false)
local ext            = os.getenv('EXTERNAL_IP')
local srv            = os.getenv('NEXTPATH_DNS_IP') or '10.77.77.77'
local srv2           = os.getenv('GLOBAL_DNS_IP') or '10.88.88.88'
local ipv6_en        = bool_env('ENABLE_IPV6',   true)
local ipv6_proxy_only = bool_env('IPV6_PROXY_ONLY', true)
local dns_addr_1     = os.getenv('DNS_ADDR_1') or '127.0.0.1'
local dns_addr_2     = os.getenv('DNS_ADDR_2') or '127.0.0.2'
local proxy_addr     = os.getenv('PROXY_ADDR') or '127.0.0.3'
local proxy_port     = os.getenv('PROXY_PORT') or '53'
local result_dir     = os.getenv('RESULT_DIR') or '/app/nextpath/result'

local doh_en         = bool_env('DOH_ENABLE',    false)
local block_ads_en   = bool_env('BLOCK_ADS',     true)
local doh_port       = tonumber(os.getenv('DOH_PORT')) or 443
local doh_cert, doh_key = os.getenv('DOH_CERT'), os.getenv('DOH_KEY')

-- Load base modules
modules = { 'policy', 'view', 'serve_stale < cache', 'predict', 'fallback_tcp' }

-- Create control socket for the instance
if instance then
    net.listen('/run/knot-resolver/control/' .. instance, nil, { kind = 'control' })
end

-- Calculate cache size dynamically based on host RAM or CACHE_SIZE env var
-- CACHE_SIZE can be an absolute size like "128" (MB) or a percentage like "5%"
local csz = 0
local env_cache = os.getenv('CACHE_SIZE')

local function get_host_mem_mb()
    local mem = 0
    local f = io.open('/proc/meminfo', 'r')
    if f then 
        for ln in f:lines() do 
            local m = ln:match('MemTotal:%s+(%d+)') 
            if m then mem = tonumber(m) break end 
        end 
        f:close() 
    end
    return mem / 1024
end

if env_cache and env_cache ~= "" then
    if env_cache:match("%%$") then
        local pct = tonumber(env_cache:sub(1, -2))
        if pct and pct > 0 and pct <= 100 then
            csz = (get_host_mem_mb() * (pct / 100)) * MB
        end
    else
        local val = tonumber(env_cache)
        if val and val > 0 then
            csz = val * MB
        end
    end
end

if csz <= 0 then 
    -- Default fallback to 5% of host memory
    csz = (get_host_mem_mb() * 0.05) * MB
    if csz <= 0 then csz = 256 * MB end
end

-- Configure address bindings, ports, and cache for each instance
if base_instance == '1' then
    -- NextPATH DNS (Instance 1)
    net.listen(dns_addr_1, 53, {kind = 'dns', freebind = true, reuseport = true})
    net.listen(srv, 53, {kind = 'dns', freebind = true, reuseport = true})
    if pub == 'y' and ext and ext ~= "" then
        net.listen(ext, 53, {kind = 'dns', freebind = true, reuseport = true})
    end

    if doh_en == 'y' and doh_cert and doh_cert ~= "" and doh_key and doh_key ~= "" then
        local f1, f2 = io.open(doh_cert, "r"), io.open(doh_key, "r")
        if f1 and f2 then
            f1:close(); f2:close()
            net.tls(doh_cert, doh_key)
            modules.load('http')
            local doh_opts = { kind = 'doh2', freebind = true, reuseport = true }
            net.listen(dns_addr_1, doh_port, doh_opts)
            net.listen(srv, doh_port, doh_opts)
            if pub == 'y' and ext and ext ~= "" then
                net.listen(ext, doh_port, doh_opts)
            end
        end
    end
    cache.open(csz, 'lmdb:///var/cache/knot-resolver/' .. base_instance)

elseif base_instance == '2' then
    -- Full DNS (Instance 2)
    net.listen(dns_addr_2, 53, {kind = 'dns', freebind = true, reuseport = true})
    net.listen(srv2, 53, {kind = 'dns', freebind = true, reuseport = true})

    if doh_en == 'y' and doh_cert and doh_cert ~= "" and doh_key and doh_key ~= "" then
        local f1, f2 = io.open(doh_cert, "r"), io.open(doh_key, "r")
        if f1 and f2 then
            f1:close(); f2:close()
            net.tls(doh_cert, doh_key)
            modules.load('http')
            local doh_opts = { kind = 'doh2', freebind = true, reuseport = true }
            net.listen(dns_addr_2, doh_port, doh_opts)
            net.listen(srv2, doh_port, doh_opts)
        end
    end
    cache.open(csz, 'lmdb:///var/cache/knot-resolver/' .. base_instance)
end

-- Action for blocking (returns 0.0.0.0 / :: instead of slow NXDOMAIN)
local action_deny = policy.ANSWER({
    [kres.type.A]    = { rdata = kres.str2ip('0.0.0.0'), ttl = neg_ttl },
    [kres.type.AAAA] = { rdata = kres.str2ip('::'),      ttl = neg_ttl },
})

-- Apply routing and override policies
if block_ads_en == 'y' then
    policy.add(policy.rpz(action_deny, result_dir .. '/adblock.rpz', true))
end
policy.add(policy.rpz(action_deny, result_dir .. '/deny.rpz', true))

if base_instance == '1' then
    -- NextPATH DNS: Routes blocked domains to the Go daemon NextPATH (proxy_addr@proxy_port)
    policy.add(policy.rpz(policy.STUB(proxy_addr .. '@' .. proxy_port), result_dir .. '/proxy.rpz', true))
elseif base_instance == '2' then
    -- Full DNS: Blocked sites are blocked directly (without proxying)
    policy.add(policy.rpz(action_deny, result_dir .. '/deny2.rpz', true))
end

-- IPv6 optimization: fast SOA response to AAAA queries when IPv6 is disabled
policy.add(function (state, query)
    if (ipv6_en == 'n' and query.stype == kres.type.AAAA) or 
       (ipv6_proxy_only == 'y' and base_instance == '1' and query.stype == kres.type.AAAA) then
        return policy.ANSWER({[kres.type.SOA] = {rdata = kres.parse_rdata({'SOA . . 1 1 1 1 ' .. neg_ttl}), ttl = neg_ttl}}, true)
    end
end)

-- Filter invalid reverse DNS queries
policy.add(policy.pattern(policy.ANSWER({[kres.type.SOA] = {rdata = kres.parse_rdata({'SOA . . 1 1 1 1 ' .. neg_ttl}), ttl = neg_ttl}}, true), '.*_.*\4arpa\0'))


-- Register standard callbacks for special domains (RFC 6761)
for _, item in ipairs(policy.special_names) do 
    policy.add(item.cb) 
end

-- Route alternative TLDs through OpenNIC resolvers
local opennic_ips_env = os.getenv('OPENNIC_IPS')
local opennic_ips = {'94.247.43.254', '95.216.99.249', '152.53.15.127', '185.226.181.19'}
if opennic_ips_env and opennic_ips_env ~= "" then
    opennic_ips = {}
    for ip in string.gmatch(opennic_ips_env, "([^,%s\"']+)") do
        table.insert(opennic_ips, ip)
    end
end
policy.add(policy.suffix(policy.FORWARD(opennic_ips), alt_zones))

-- Dynamic custom DNS routes (e.g., CUSTOM_DNS_ROUTES="ru,su,xn--p1ai=195.208.4.1,195.208.5.1; corp=10.0.0.1")
local custom_routes = os.getenv('CUSTOM_DNS_ROUTES')
if custom_routes and custom_routes ~= "" then
    for mapping in string.gmatch(custom_routes, "([^;]+)") do
        local doms_str, ips_str = mapping:match("^%s*(.-)%s*=%s*(.-)%s*$")
        if doms_str and ips_str then
            local doms = {}
            for d in string.gmatch(doms_str, "([^,%s\"']+)") do
                table.insert(doms, d)
            end
            local ips = {}
            for ip in string.gmatch(ips_str, "([^,%s\"']+)") do
                table.insert(ips, ip)
            end
            if #doms > 0 and #ips > 0 then
                policy.add(policy.suffix(policy.FORWARD(ips), policy.todnames(doms)))
            end
        end
    end
end

-- Resolve all other domains via upstreams
policy.add(policy.all(policy.FORWARD(upstreams)))

-- Cache limits tuning
net.ipv6 = (ipv6_en == 'y')
cache.min_ttl(min_ttl)
cache.max_ttl(max_ttl)
cache.ns_tout(1)
